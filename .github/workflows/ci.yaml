name: ci/cd pipeline to deploy artifact into tomcat
on:
  push:
    branches: master
jobs:
  build-deploy:
     runs-on: ubuntu-latest
     steps:
      - name: checkout code 
        uses: actions/checkout@v5
      - name: set-up jdk 
        uses: actions/setup-java@v5
        with:
           distribution: "temurin"
           java-version:  '17'
      - name: validate with maven
        run: mvn validate

      - name: compile with maven
        run: mvn compile

      - name: test with maven
        run: mvn test

      - name: package with maven
        run: mvn package

      - name: verfiy the war file
        run: ls -lh target/
        
      - name: Build Test and sonarqube Scan
        env:
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST_URL }}
          run: |
            -Dsonar.projectKey=train \
            -Dsonar.projectName=TrainBook \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"
          
        
        
      
      

          
      
