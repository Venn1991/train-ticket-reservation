name: CI-CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate, Compile, Test, Package
        run: mvn -B clean package

      - name: Prepare WAR
        run: |
          mkdir -p deploy
          cp target/*.war deploy/train-booking.war
          ls -lh deploy/

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: train-booking-war
          path: deploy/train-booking.war

  #JOB 2 - DEV
  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-booking-war
          path: deploy

      - name: Deploy to DEV Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e
          test -n "$TOMCAT_HOST" || exit 1
          test -n "$TOMCAT_USER" || exit 1
          test -n "$TOMCAT_PASSWORD" || exit 1
          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deploy/train-booking.war \
            "${TOMCAT_HOST}/manager/text/deploy?path=/TrainBook-DEV&update=true"

  #JOB 3 - TEST
  deploy-test:
    name: Deploy TEST
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-booking-war
          path: deploy

      - name: Deploy to TEST Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e
          test -n "$TOMCAT_HOST" || exit 1
          test -n "$TOMCAT_USER" || exit 1
          test -n "$TOMCAT_PASSWORD" || exit 1
          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deploy/train-booking.war \
            "${TOMCAT_HOST}/manager/text/deploy?path=/TrainBook-TEST&update=true"

  #JOB 4 - PRE-PROD
  deploy-preprod:
    name: Deploy PreProd
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-booking-war
          path: deploy

      - name: Deploy to PRE-PROD Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e
          test -n "$TOMCAT_HOST" || exit 1
          test -n "$TOMCAT_USER" || exit 1
          test -n "$TOMCAT_PASSWORD" || exit 1
          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deploy/train-booking.war \
            "${TOMCAT_HOST}/manager/text/deploy?path=/TrainBook-PREPROD&update=true"

  #JOB 5 - PROD
  deploy-prod:
    name: Deploy PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-booking-war
          path: deploy

      - name: Deploy to PROD Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e
          test -n "$TOMCAT_HOST" || exit 1
          test -n "$TOMCAT_USER" || exit 1
          test -n "$TOMCAT_PASSWORD" || exit 1
          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deploy/train-booking.war \
            "${TOMCAT_HOST}/manager/text/deploy?path=/TrainBook&update=true"
        
