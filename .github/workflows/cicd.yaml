
name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - DEV
  workflow_dispatch:

jobs:

  # BUILD STAGE
  build:
    name: Build Maven Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Verify WAR file
        run: |
          ls -lh target/*.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war
          if-no-files-found: error
          retention-days: 5

  # DEV DEPLOYMENT STAGE
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    # Connect GitHub DEV environment
    environment:
      name: DEV

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: ./deploy

      - name: Check Tomcat Secrets
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_DEV }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_DEV }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          if [ -z "$TOMCAT_URL" ]; then
            echo "ERROR: TOMCAT_URL_DEV is missing"
            exit 1
          fi

          if [ -z "$TOMCAT_USER" ]; then
            echo "ERROR: TOMCAT_USER_DEV is missing"
            exit 1
          fi

          if [ -z "$TOMCAT_PASS" ]; then
            echo "ERROR: TOMCAT_PASS_DEV is missing"
            exit 1
          fi

          echo "All DEV Tomcat secrets are configured"

      - name: Deploy WAR to DEV Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_DEV }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_DEV }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          set -e

          WAR_FILE=$(find ./deploy -maxdepth 1 -name "*.war" -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          URL="${TOMCAT_URL%/}"

          echo "Deploying $WAR_FILE to DEV"

          curl --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$URL/deploy?path=/train-ticket-reservation&update=true"

          echo "DEV deployment completed successfully"
