name: CI-CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:
    
jobs:

  #JOB 1 - BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate with Maven
        run: mvn validate

      - name: Compile with Maven
        run: mvn compile

      - name: Test with Maven
        run: mvn test

      - name: Package with Maven
        run: mvn clean package -DskipTests

      - name: Prepare WAR
        run: |
          mkdir -p deploy
          WAR_FILE=$ (find target -maxdepth 1 -name "*.war" -print -quit)
          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi
          cp "$WAR_FILE" deploy/train-booking.war
          ls -lh deploy/
          

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-booking-war
          path: deploy/train-booking.war
          if-no-files-found: error

  # JOB 2 -DEV
  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-booking-war
          path: deploy

      - name: Deploy to DEV Tomcat
        env: 
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST}}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER}}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD}}
        run: |
          set -e
          test -n "$TOMCAT_HOST" || exit 1
          test -n "$TOMCAT_USER" || exit 1
          test -n "$TOMCAT_PASSWORD" || exit 1

          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deploy/train-booking.war \
"${TOMCAT_HOST%/}/manager/text/deploy?path=/TrainBook&update=true"

  # JOB 3 -TEST
deploy-test:
    name: Deploy TEST
    needs: build
    runs-on: ubuntu-latest
    environment: TEST

    steps: 
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: train-booking-war
          path: deploy

      - name: Deploy to TEST Tomcat
        env: 
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST}}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER}}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD}}
        run: |
          set -e
          test -n "$TOMCAT_HOST" || exit 1
