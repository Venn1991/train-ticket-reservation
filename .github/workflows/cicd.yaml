          test -n "$TOMCAT_PASSWORD" || exit 1

          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T deploy/train-booking.war \
"${TOMCAT_HOST%/}/manager/text/deploy?path=/TrainBook&update=true"

