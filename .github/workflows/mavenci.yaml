name: ci pipeline to build java code and code quality by using sonarqube 
on:
   push:
     branches: master
jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - name: checkout code
         uses: actions/checkout@v5
       - name: set-up jdk
         uses: actions/setup-java@v5
         with:
            distribution: 'temurin'
            java-version: '17'
       - name: validate with maven 
         run:  mvn validate
       - name: compile with maven 
         run:  mvn compile 
       - name: test with maven 
         run:  mvn test
       - name: package with maven 
         run:  mvn package
       - name: verify war file 
         run:  ls -lh target/
       - name: SonarQube scan
         uses: SonarSource/sonarqube-scan-action@v6
         env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
         with:
          args: >
            -Dsonar.projectKey=vcube154-train-book
            -Dsonar.projectName=vcube154-train-book

         

   

       




          
         
       
