name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build WAR with Maven
        run: mvn clean package -DskipTests

      - name: Verify WAR file
        run: ls -lh target/*.war

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war

  # Deploy DEV
  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Deploy to Tomcat DEV
        env:
          TOMCAT_USER: ${{ secrets.DEV_TOMCAT_USER }}
          TOMCAT_PASS: ${{ secrets.DEV_TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.DEV_TOMCAT_HOST }}
        run: |
          ls -lh ./artifact/
          WAR_FILE=$(ls ./artifact/*.war | head -n 1)
          echo "Deploying $WAR_FILE to $TOMCAT_HOST"
          curl --fail -u "$TOMCAT_USER:$TOMCAT_PASS" \
          -T "$WAR_FILE" \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"

  # Deploy QA
  deploy-qa:
    name: Deploy QA
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Deploy to Tomcat QA
        env:
          TOMCAT_USER: ${{ secrets.QA_TOMCAT_USER }}
          TOMCAT_PASS: ${{ secrets.QA_TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.QA_TOMCAT_HOST }}
        run: |
          ls -lh ./artifact/
          WAR_FILE=$(ls ./artifact/*.war | head -n 1)
          curl --fail -u "$TOMCAT_USER:$TOMCAT_PASS" \
          -T "$WAR_FILE" \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"

  # Deploy PrePROD
  deploy-preprod:
    name: Deploy PrePROD
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Deploy to Tomcat PrePROD
        env:
          TOMCAT_USER: ${{ secrets.PREPROD_TOMCAT_USER }}
          TOMCAT_PASS: ${{ secrets.PREPROD_TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.PREPROD_TOMCAT_HOST }}
        run: |
          ls -lh ./artifact/
          WAR_FILE=$(ls ./artifact/*.war | head -n 1)
          curl --fail -u "$TOMCAT_USER:$TOMCAT_PASS" \
          -T "$WAR_FILE" \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"

  # Deploy PROD
  deploy-prod:
    name: Deploy PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Deploy to Tomcat PROD
        env:
          TOMCAT_USER: ${{ secrets.PROD_TOMCAT_USER }}
          TOMCAT_PASS: ${{ secrets.PROD_TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.PROD_TOMCAT_HOST }}
        run: |
          ls -lh ./artifact/
          WAR_FILE=$(ls ./artifact/*.war | head -n 1)
          curl --fail -u "$TOMCAT_USER:$TOMCAT_PASS" \
          -T "$WAR_FILE" \
          "http://$TOMCAT_HOST:8080/manager/text/deploy?path=/TrainBook&update=true"
       
